<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>かんたん家計簿</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3b5bdb">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="家計簿">
<style>
  :root {
    --bg: #f5f6f8;
    --card-bg: #ffffff;
    --border: #e2e4e9;
    --text: #1f2328;
    --text-sub: #6b7280;
    --income: #1a7f5a;
    --income-bg: #e6f6f0;
    --expense: #c62828;
    --expense-bg: #fdecec;
    --accent: #3b5bdb;
    --accent-hover: #2f47ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 22px;
    margin: 0;
  }
  .app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
    gap: 12px;
  }
  .user-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--text-sub);
    flex-shrink: 0;
  }
  .user-badge #user-name {
    font-weight: 600;
    color: var(--text);
  }
  #switch-user {
    border: 1px solid var(--border);
    background: #fff;
    color: var(--text-sub);
    border-radius: 999px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .summary .item {
    text-align: center;
  }
  .summary .label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  .summary .value {
    font-size: 20px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .summary .income .value { color: var(--income); }
  .summary .expense .value { color: var(--expense); }

  form {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  form .full { grid-column: 1 / -1; }
  label {
    display: block;
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  input, select {
    width: 100%;
    padding: 9px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .type-toggle {
    display: flex;
    gap: 8px;
  }
  .type-toggle button {
    flex: 1;
    padding: 9px 0;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    cursor: pointer;
    font-size: 14px;
    color: var(--text-sub);
  }
  .type-toggle button.active[data-type="expense"] {
    background: var(--expense-bg);
    border-color: var(--expense);
    color: var(--expense);
    font-weight: 600;
  }
  .type-toggle button.active[data-type="income"] {
    background: var(--income-bg);
    border-color: var(--income);
    color: var(--income);
    font-weight: 600;
  }
  button.submit {
    grid-column: 1 / -1;
    padding: 11px 0;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button.submit:hover { background: var(--accent-hover); }

  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .list-header h2 {
    font-size: 15px;
    margin: 0;
  }
  #month-filter {
    width: auto;
  }
  ul#list {
    list-style: none;
    margin: 0;
    padding: 0;
  }
  ul#list li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  ul#list li:last-child { border-bottom: none; }
  .li-date {
    font-size: 12px;
    color: var(--text-sub);
    width: 70px;
    flex-shrink: 0;
  }
  .li-cat {
    font-size: 12px;
    padding: 3px 8px;
    border-radius: 999px;
    background: #eef0f4;
    color: var(--text-sub);
    flex-shrink: 0;
    white-space: nowrap;
  }
  .li-memo {
    flex: 1;
    font-size: 14px;
    color: var(--text);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .li-amount {
    font-size: 14px;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .li-amount.income { color: var(--income); }
  .li-amount.expense { color: var(--expense); }
  .li-delete {
    border: none;
    background: none;
    color: var(--text-sub);
    cursor: pointer;
    font-size: 16px;
    padding: 2px 6px;
    line-height: 1;
  }
  .li-delete:hover { color: var(--expense); }
  .empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 14px;
    padding: 20px 0;
  }
  .pin-gate {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 100;
  }
  .pin-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 24px;
    width: 100%;
    max-width: 320px;
    text-align: center;
  }
  .pin-box h2 {
    font-size: 18px;
    margin: 0 0 6px;
  }
  .pin-box p {
    font-size: 13px;
    color: var(--text-sub);
    margin: 0 0 16px;
  }
  #pin-input {
    text-align: center;
    letter-spacing: 6px;
    font-size: 18px;
    margin-bottom: 12px;
  }
  .pin-error {
    color: var(--expense);
    font-size: 13px;
    margin: 10px 0 0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card-bg: #1e2128;
      --border: #2c3038;
      --text: #e6e8eb;
      --text-sub: #9aa0a8;
      --income: #4fd1a5;
      --income-bg: #123328;
      --expense: #ff6b6b;
      --expense-bg: #3a1c1c;
      --accent: #6c8bff;
      --accent-hover: #8aa2ff;
    }
    input, select, .type-toggle button { background: #262a32; color: var(--text); }
    .li-cat { background: #2a2e36; }
    #switch-user { background: #262a32; }
  }
</style>
</head>
<body>

<div class="pin-gate" id="pin-gate">
  <div class="pin-box">
    <h2>かんたん家計簿</h2>
    <p>PINコードを入力してください</p>
    <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="••••">
    <button type="button" class="submit" id="pin-submit">開く</button>
    <p class="pin-error" id="pin-error" style="display:none;">PINが違います</p>
  </div>
</div>

<div class="wrap" id="app" style="display:none;">
  <div class="app-header">
    <h1>かんたん家計簿</h1>
    <div class="user-badge">
      <span id="user-name"></span>
      <button type="button" id="switch-user">切替</button>
    </div>
  </div>

  <div class="card">
    <div class="summary">
      <div class="item income">
        <div class="label">収入</div>
        <div class="value" id="total-income">¥0</div>
      </div>
      <div class="item expense">
        <div class="label">支出</div>
        <div class="value" id="total-expense">¥0</div>
      </div>
      <div class="item">
        <div class="label">差引</div>
        <div class="value" id="total-balance">¥0</div>
      </div>
    </div>
  </div>

  <div class="card">
    <form id="entry-form">
      <div class="full type-toggle">
        <button type="button" data-type="expense" class="active">支出</button>
        <button type="button" data-type="income">収入</button>
      </div>
      <div>
        <label for="date">日付</label>
        <input type="date" id="date" required>
      </div>
      <div>
        <label for="amount">金額</label>
        <input type="number" id="amount" min="0" step="1" placeholder="1200" required>
      </div>
      <div>
        <label for="category">カテゴリー</label>
        <select id="category"></select>
      </div>
      <div>
        <label for="memo">メモ</label>
        <input type="text" id="memo" placeholder="任意">
      </div>
      <button type="submit" class="submit">記録する</button>
    </form>
  </div>

  <div class="card">
    <div class="list-header">
      <h2>記録一覧</h2>
      <select id="month-filter"></select>
    </div>
    <ul id="list"></ul>
    <div class="empty" id="empty-msg" style="display:none;">まだ記録がありません</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, where } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCPoIeu3nak3PKLIYoOy2Ce094MjiiSCrQ",
  authDomain: "kakeibo-app-ac30a.firebaseapp.com",
  projectId: "kakeibo-app-ac30a",
  storageBucket: "kakeibo-app-ac30a.firebasestorage.app",
  messagingSenderId: "570947851408",
  appId: "1:570947851408:web:ddfe510991dfb105efb415"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const entriesCol = collection(db, 'entries');

// PINそのものではなくSHA-256ハッシュを埋め込む。UI経由のアクセスを妨げるだけの簡易的な鍵であり、
// Firestoreのセキュリティルール自体はentriesコレクションを誰でも読み書きできる設定にしている。
// PINごとにownerを紐づけ、記録はownerで絞り込むことで人ごとに完全に別の家計簿として見せている。
const PIN_USERS = [
  { hash: '13c6f7d6022a155ce7e38d7485faf6830594bae46f2120dbe04c795ec4cc0e20', owner: 'ryosuke', name: 'りょうすけ' },
  { hash: '79d9d8f002c1c955fa0d21eeaaf2ebf03c3a878d2fdcb6e78d915b3ed81cc886', owner: 'koyama', name: '小山' },
  { hash: '2ec42bc1f3e672fc1cf7fdcfc23246415dcf20f03c0d4a5bbbd92a185708f5b7', owner: 'rio', name: 'りおちゃん' }
];
const OWNER_KEY = 'kakeibo-owner';

const CATEGORIES = {
  expense: ['食費', '日用品', '交通費', '娯楽', '医療', '固定費', 'その他'],
  income: ['給与', '副収入', 'その他']
};

const pinGate = document.getElementById('pin-gate');
const appEl = document.getElementById('app');
const pinInput = document.getElementById('pin-input');
const pinSubmit = document.getElementById('pin-submit');
const pinError = document.getElementById('pin-error');

async function sha256Hex(text) {
  const data = new TextEncoder().encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function tryUnlock() {
  const hash = await sha256Hex(pinInput.value.trim());
  const user = PIN_USERS.find(u => u.hash === hash);
  if (user) {
    localStorage.setItem(OWNER_KEY, user.owner);
    unlock(user);
  } else {
    pinError.style.display = 'block';
    pinInput.value = '';
    pinInput.focus();
  }
}

function unlock(user) {
  pinGate.style.display = 'none';
  appEl.style.display = '';
  pinInput.value = '';
  pinError.style.display = 'none';
  initApp(user);
}

pinSubmit.addEventListener('click', tryUnlock);
pinInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') tryUnlock(); });

const savedOwner = localStorage.getItem(OWNER_KEY);
const savedUser = PIN_USERS.find(u => u.owner === savedOwner);
if (savedUser) {
  unlock(savedUser);
} else {
  pinInput.focus();
}

function initApp(user) {
  document.getElementById('user-name').textContent = user.name;
  document.getElementById('switch-user').addEventListener('click', () => {
    localStorage.removeItem(OWNER_KEY);
    location.reload();
  });
  const ownedEntriesQuery = query(entriesCol, where('owner', '==', user.owner));

  const form = document.getElementById('entry-form');
  const dateInput = document.getElementById('date');
  const amountInput = document.getElementById('amount');
  const categorySelect = document.getElementById('category');
  const memoInput = document.getElementById('memo');
  const typeButtons = document.querySelectorAll('.type-toggle button');
  const listEl = document.getElementById('list');
  const emptyMsg = document.getElementById('empty-msg');
  const monthFilter = document.getElementById('month-filter');
  const totalIncomeEl = document.getElementById('total-income');
  const totalExpenseEl = document.getElementById('total-expense');
  const totalBalanceEl = document.getElementById('total-balance');

  let currentType = 'expense';
  let allEntries = [];

  function formatYen(n) {
    return '¥' + n.toLocaleString('ja-JP');
  }

  function todayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function setType(type) {
    currentType = type;
    typeButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.type === type));
    populateCategories();
  }

  function populateCategories() {
    categorySelect.innerHTML = '';
    CATEGORIES[currentType].forEach(cat => {
      const opt = document.createElement('option');
      opt.value = cat;
      opt.textContent = cat;
      categorySelect.appendChild(opt);
    });
  }

  function populateMonthFilter(entries) {
    const months = Array.from(new Set(entries.map(e => e.date.slice(0, 7)))).sort().reverse();
    const current = monthFilter.value;
    monthFilter.innerHTML = '';
    const allOpt = document.createElement('option');
    allOpt.value = 'all';
    allOpt.textContent = 'すべて';
    monthFilter.appendChild(allOpt);
    months.forEach(m => {
      const opt = document.createElement('option');
      opt.value = m;
      opt.textContent = m.replace('-', '年') + '月';
      monthFilter.appendChild(opt);
    });
    if (months.includes(current) || current === 'all') {
      monthFilter.value = current;
    } else {
      monthFilter.value = months.length ? months[0] : 'all';
    }
  }

  function render() {
    populateMonthFilter(allEntries);

    const selectedMonth = monthFilter.value;
    const filtered = selectedMonth === 'all'
      ? allEntries
      : allEntries.filter(e => e.date.slice(0, 7) === selectedMonth);

    const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || 0) - (a.createdAt || 0));

    listEl.innerHTML = '';
    emptyMsg.style.display = sorted.length ? 'none' : 'block';

    sorted.forEach(entry => {
      const li = document.createElement('li');

      const dateSpan = document.createElement('span');
      dateSpan.className = 'li-date';
      dateSpan.textContent = entry.date.slice(5).replace('-', '/');

      const catSpan = document.createElement('span');
      catSpan.className = 'li-cat';
      catSpan.textContent = entry.category;

      const memoSpan = document.createElement('span');
      memoSpan.className = 'li-memo';
      memoSpan.textContent = entry.memo || '';

      const amountSpan = document.createElement('span');
      amountSpan.className = 'li-amount ' + entry.type;
      amountSpan.textContent = (entry.type === 'income' ? '+' : '-') + formatYen(entry.amount);

      const delBtn = document.createElement('button');
      delBtn.className = 'li-delete';
      delBtn.textContent = '×';
      delBtn.title = '削除';
      delBtn.addEventListener('click', () => {
        deleteDoc(doc(db, 'entries', entry.id));
      });

      li.append(dateSpan, catSpan, memoSpan, amountSpan, delBtn);
      listEl.appendChild(li);
    });

    const totalIncome = filtered.filter(e => e.type === 'income').reduce((s, e) => s + e.amount, 0);
    const totalExpense = filtered.filter(e => e.type === 'expense').reduce((s, e) => s + e.amount, 0);
    totalIncomeEl.textContent = formatYen(totalIncome);
    totalExpenseEl.textContent = formatYen(totalExpense);
    totalBalanceEl.textContent = formatYen(totalIncome - totalExpense);
  }

  typeButtons.forEach(btn => {
    btn.addEventListener('click', () => setType(btn.dataset.type));
  });

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const amount = parseInt(amountInput.value, 10);
    if (!amount || amount <= 0) return;

    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    try {
      await addDoc(entriesCol, {
        date: dateInput.value || todayStr(),
        type: currentType,
        category: categorySelect.value,
        amount,
        memo: memoInput.value.trim(),
        createdAt: Date.now(),
        owner: user.owner
      });
      amountInput.value = '';
      memoInput.value = '';
      amountInput.focus();
    } finally {
      submitBtn.disabled = false;
    }
  });

  monthFilter.addEventListener('change', render);

  dateInput.value = todayStr();
  setType('expense');

  onSnapshot(ownedEntriesQuery, (snapshot) => {
    allEntries = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
    render();
  });
}
</script>
</body>
</html>
